# Installé par maj-sites (https://github.com/Kevdacosta07/maj-sites). Ne pas renommer ce fichier :
# le bouton « Tout mettre à jour » le lance par son nom.
#
# Étapes : met à jour next (et les paquets @next/*, eslint-config-next, react, react-dom),
# vérifie que le site build, pousse le commit, lance le workflow de déploiement du dépôt,
# attend qu'il réussisse puis vérifie que le site répond.
# Si le build échoue, rien n'est poussé ni déployé.
name: Mise à jour Next.js

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: "Version de Next.js à installer (ex. 16.4.6)"
        required: true
      maj_react:
        description: "Mettre aussi à jour react et react-dom (dernière 19.x)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: update-deps
  cancel-in-progress: false

env:
  DEPLOY_WORKFLOW: "deploy.yml" # vide = pas de déploiement par GitHub Actions
  SITE_URL: "https://carbweb.ch"
  NEXT_VERSION: ${{ inputs.next_version }}
  MAJ_REACT: ${{ inputs.maj_react }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  mettre-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Vérifier la version demandée
        run: |
          if [[ ! "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide : $NEXT_VERSION"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dépendances actuelles
        run: npm ci --no-audit --no-fund

      - name: Mettre à jour Next.js
        id: maj
        run: |
          avant=$(node -p "require('./node_modules/next/package.json').version")
          react_version=""
          if [ "$MAJ_REACT" = "true" ]; then
            # npm liste les versions dans l'ordre de publication (un correctif 19.1.x peut sortir après la 19.3.x) :
            # on prend la plus haute.
            react_version=$(npm view 'react@^19' version --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const v=[].concat(JSON.parse(d));const n=s=>s.split('.').map(Number);v.sort((a,b)=>{const x=n(a),y=n(b);return x[0]-y[0]||x[1]-y[1]||x[2]-y[2]});console.log(v.at(-1))})")
          fi
          # Réécrit package.json en gardant le style de chaque dépendance (^, ~ ou version exacte).
          # Ne rétrograde jamais un paquet.
          node - "$NEXT_VERSION" "$react_version" <<'JS'
          const fs = require('fs');
          const [next, react] = process.argv.slice(2);
          const n = (s) => (s.match(/\d+\.\d+\.\d+/)?.[0] ?? '0.0.0').split('.').map(Number);
          const inferieur = (a, b) => { const x = n(a), y = n(b); return (x[0] - y[0] || x[1] - y[1] || x[2] - y[2]) < 0; };
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const cibles = { next, 'eslint-config-next': next, '@next/eslint-plugin-next': next, '@next/bundle-analyzer': next,
                           '@next/third-parties': next, '@next/mdx': next, '@next/env': next };
          if (react) Object.assign(cibles, { react, 'react-dom': react });
          for (const section of ['dependencies', 'devDependencies']) {
            for (const [nom, version] of Object.entries(cibles)) {
              const actuel = pkg[section]?.[nom];
              if (!actuel) continue;
              if ((nom === 'react' || nom === 'react-dom') && !/^[\^~]?19\./.test(actuel)) continue; // seulement react 19.x
              if (inferieur(version, actuel)) { console.log(`${nom} : ${actuel} conservé (${version} est plus ancienne)`); continue; }
              const prefixe = (actuel.match(/^[\^~]/) || [''])[0];
              pkg[section][nom] = prefixe + version;
              console.log(`${nom} : ${actuel} → ${prefixe + version}`);
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          JS
          npm install --no-audit --no-fund
          apres=$(node -p "require('./node_modules/next/package.json').version")
          echo "avant=$avant" >> "$GITHUB_OUTPUT"
          echo "apres=$apres" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- package.json package-lock.json; then
            echo "change=false" >> "$GITHUB_OUTPUT"
            echo "Déjà à jour (next $apres)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "change=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Vérifier que le site build
        if: steps.maj.outputs.change == 'true'
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "Pas de script build : vérification ignorée."
          fi

      - name: Pousser la mise à jour
        if: steps.maj.outputs.change == 'true'
        env:
          AVANT: ${{ steps.maj.outputs.avant }}
          APRES: ${{ steps.maj.outputs.apres }}
          BRANCHE: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): Next.js $AVANT → $APRES (maj-sites)"
          git push origin "HEAD:$BRANCHE"

      - name: Lancer le déploiement et attendre la fin
        if: steps.maj.outputs.change == 'true' && env.DEPLOY_WORKFLOW != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCHE: ${{ github.ref_name }}
        run: |
          depart=$(date -u -d '-10 seconds' +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run "$DEPLOY_WORKFLOW" --ref "$BRANCHE"
          id=""
          for i in $(seq 1 30); do
            id=$(gh run list --workflow "$DEPLOY_WORKFLOW" --event workflow_dispatch --created ">=$depart" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$id" ] && break
            sleep 5
          done
          if [ -z "$id" ]; then echo "::error::Run de déploiement introuvable"; exit 1; fi
          echo "Déploiement : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run watch "$id" --exit-status --interval 15

      - name: Vérifier que le site répond
        if: steps.maj.outputs.change == 'true' && env.DEPLOY_WORKFLOW != '' && env.SITE_URL != ''
        run: |
          code=000
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -L --max-time 20 -w '%{http_code}' "$SITE_URL" || true)
            [[ "$code" =~ ^[23] ]] && break
            sleep 20
          done
          echo "$SITE_URL → HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$code" =~ ^[23] ]]

      - name: Résumé
        if: steps.maj.outputs.change == 'true'
        env:
          AVANT: ${{ steps.maj.outputs.avant }}
          APRES: ${{ steps.maj.outputs.apres }}
        run: echo "Next.js $AVANT → $APRES" | tee -a "$GITHUB_STEP_SUMMARY"
